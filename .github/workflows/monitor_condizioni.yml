name: Monitoraggio Condizioni Generali di Fornitura

on:
  schedule:
    # Esegue il primo martedì del mese ogni 2 mesi (Feb, Apr, Giu, Ago, Ott, Dic) alle 08:00 UTC
    - cron: '0 8 1-7 2,4,6,8,10,12 2'
  workflow_dispatch: # Permette anche l'esecuzione manuale in qualsiasi momento

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Esegui Controllo Link CGF
        env:
          EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: |
          python agent_cgf.py
