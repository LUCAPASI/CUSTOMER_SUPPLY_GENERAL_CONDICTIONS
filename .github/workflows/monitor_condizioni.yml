name: Monitor CGF Clienti - Agente IA

on:
  schedule:
    # Esegue ogni mese il primo lunedì alle 07:00 UTC
    - cron: '0 7 1-7 * *'
  workflow_dispatch: # Consente l'esecuzione manuale su richiesta

jobs:
  check-agreements:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4 pypdf openai

      - name: Run Monitoring Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python agent_cgf.py
